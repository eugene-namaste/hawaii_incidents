<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>Incident Viewer</title>

  <link rel="stylesheet" href="https://js.arcgis.com/4.34/esri/themes/light/main.css" />
  <script src="https://cdn.jsdelivr.net/npm/js-yaml@4.1.0/dist/js-yaml.min.js"></script>
  <script src="https://js.arcgis.com/4.34/"></script>

  <style>
html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      font-family: Arial, Helvetica, sans-serif;
      color: #222;
    }

    #app {
      width: 100vw;
      height: 100vh;
      display: grid;
      grid-template-columns: 380px minmax(0, 1fr);
      grid-template-rows: minmax(0, 1fr);
      overflow: hidden;
    }

    #sidebar {
      display: flex;
      flex-direction: column;
      min-width: 0;
      min-height: 0;
      height: 100%;
      overflow: hidden;
      border-right: 1px solid #cfcfcf;
      background: #fff;
      z-index: 2;
    }

    #header {
      padding: 14px 16px 10px;
      border-bottom: 1px solid #ddd;
    }

    #header h1 {
      margin: 0 0 4px;
      font-size: 20px;
      font-weight: 700;
    }

    #header .subtitle {
      font-size: 12px;
      color: #666;
    }

    #filters {
      flex: 0 0 auto;
      padding: 10px 12px;
      border-bottom: 1px solid #ddd;
      overflow: visible;
      background: #fff;
    }

    .filter-block {
      margin-bottom: 9px;
    }

    .filter-title {
      margin-bottom: 5px;
      font-size: 12px;
      font-weight: 700;
      text-transform: uppercase;
      color: #555;
    }

    select {
      width: 100%;
      box-sizing: border-box;
      border: 1px solid #bbb;
      border-radius: 3px;
      background: white;
      padding: 6px;
      font-size: 13px;
    }

    select[multiple] {
      height: 78px;
      min-height: 78px;
    }

    .hint {
      margin-top: 3px;
      font-size: 10px;
      line-height: 1.2;
      color: #777;
    }

    #filterActions {
      display: flex;
      gap: 8px;
    }

    button {
      border: 1px solid #888;
      background: #f6f6f6;
      border-radius: 3px;
      padding: 7px 11px;
      cursor: pointer;
      font-size: 13px;
    }

    button.primary {
      color: #fff;
      background: #007ac2;
      border-color: #007ac2;
    }

    button:hover {
      filter: brightness(0.97);
    }

    #resultsHeader {
      flex: 0 0 auto;
      padding: 9px 12px;
      border-bottom: 1px solid #ddd;
      background: #f7f7f7;
      font-size: 13px;
      font-weight: 700;
    }

    #incidentList {
      flex: 1 1 auto;
      min-height: 0;
      overflow-y: auto;
      overscroll-behavior: contain;
    }

    .incident {
      padding: 11px 12px;
      border-bottom: 1px solid #e5e5e5;
      cursor: pointer;
      transition: background 0.12s ease;
    }

    .incident:hover {
      background: #f3f8fc;
    }

    .incident.selected {
      background: #e3f2fd;
      border-left: 4px solid #007ac2;
      padding-left: 8px;
    }

    .incident-id {
      font-size: 14px;
      font-weight: 700;
      margin-bottom: 4px;
    }

    .incident-address {
      font-size: 13px;
      margin-bottom: 4px;
      line-height: 1.25;
    }

    .incident-meta {
      font-size: 12px;
      color: #666;
      line-height: 1.35;
    }

    #status {
      flex: 0 0 auto;
      padding: 8px 12px;
      border-top: 1px solid #ddd;
      font-size: 12px;
      color: #666;
      min-height: 16px;
    }

    #viewDiv {
      width: 100%;
      height: 100%;
      min-width: 0;
      min-height: 0;
      overflow: hidden;
    }

    .empty {
      padding: 20px;
      color: #666;
      text-align: center;
      font-size: 13px;
    }

    @media (max-width: 800px) {
      #app {
        grid-template-columns: 320px minmax(0, 1fr);
      }
    }

    @media (max-height: 700px) {
      #header {
        padding-top: 8px;
        padding-bottom: 7px;
      }

      #header h1 {
        font-size: 17px;
      }

      #filters {
        padding-top: 7px;
        padding-bottom: 7px;
      }

      select[multiple] {
        height: 64px;
        min-height: 64px;
      }

      .filter-block {
        margin-bottom: 6px;
      }
    }
  </style>
</head>

<body>
<div id="app">
  <aside id="sidebar">
    <div id="header">
      <h1>NERIS Incident Viewer</h1>
      <div class="subtitle">Fire Service Incidents</div>
    </div>

    <div id="filters"></div>

    <div id="resultsHeader">Incidents: <span id="resultCount">0</span></div>
    <div id="incidentList"></div>
    <div id="status">Loading…</div>
  </aside>

  <main id="viewDiv"></main>
</div>

<script src="./app.js"></script>
</body>
</html>
